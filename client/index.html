<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Temayı React yüklenmeden önce uygula: aksi halde koyu tema seçiliyken
      // ilk boyamada açık tema görünüp göz alıyor.
      ;(function () {
        try {
          var mode = localStorage.getItem('zt:theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          // localStorage kapalıysa varsayılan açık tema ile devam edilir.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
