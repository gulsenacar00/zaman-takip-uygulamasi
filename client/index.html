<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus</title>
    <meta name="theme-color" content="#0a0e0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Temayı React yüklenmeden önce uygula: aksi halde ilk boyamada yanlış
      // tema görünüp göz alıyor. Varsayılan koyudur (Santoryu standardı);
      // kullanıcı hesap menüsünden açık ya da sisteme uyan temayı seçebilir.
      ;(function () {
        try {
          var mode = localStorage.getItem('zt:theme') || 'dark'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
