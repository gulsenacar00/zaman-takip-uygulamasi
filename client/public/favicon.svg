<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Clock tower building">
  <title>Focus</title>
  <style>
    /*
     * Sekme çubuğunun rengi tarayıcı temasına göre değiştiği için logo da
     * uyum sağlar: "ink" bina gövdesi, "paper" ise saat kadranı ve kapı.
     */
    .ink { fill: #10160f; }
    .paper { fill: #f5f8f4; }
    .bezel { fill: #157f45; }
    .hand { stroke: #10160f; stroke-width: 1.6; stroke-linecap: round; }

    @media (prefers-color-scheme: dark) {
      .ink { fill: #e4ebe2; }
      .paper { fill: #10160f; }
      .bezel { fill: #35d073; }
      .hand { stroke: #e4ebe2; }
    }
  </style>

  <!-- Çatı -->
  <path class="ink" d="M16 1.5 29 10.5 H3 Z" />

  <!-- Gövde -->
  <rect class="ink" x="6" y="10" width="20" height="19" />

  <!-- Zemin / kaide: binayı oturtur -->
  <rect class="ink" x="2" y="28.5" width="28" height="2.6" rx="1.1" />

  <!-- Saat: kadran binanın üst yarısını kaplayacak kadar büyük -->
  <circle class="bezel" cx="16" cy="17" r="6.6" />
  <circle class="paper" cx="16" cy="17" r="5.2" />
  <path class="hand" d="M16 17 V13.2" />
  <path class="hand" d="M16 17 H19.1" />
  <circle class="ink" cx="16" cy="17" r="0.9" />

  <!-- Kapı ve yan pencereler -->
  <rect class="paper" x="14.2" y="24.6" width="3.6" height="4.4" rx="1.8" />
  <rect class="paper" x="8.4" y="24.8" width="2.6" height="2.6" rx="0.5" />
  <rect class="paper" x="21" y="24.8" width="2.6" height="2.6" rx="0.5" />
</svg>
